# FieldZ's engine builds: the CLI only, from this fork's fieldz/* branches (upstream's own workflows stay disabled in the fork).
# A tag fieldz-engine-<version>-<n> builds Windows x64, macOS aarch64 and Linux x86_64, packs each CLI with the licence files and
# publishes a release with SHA256SUMS.txt; FieldZ pins those files by sha256. workflow_dispatch builds without publishing.
name: fieldz-engine
on:
  push:
    tags: ['fieldz-engine-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64, exe: .exe, pack: zip }
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64, exe: '', pack: zip }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, exe: '', pack: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1  # the version in rust-toolchain.toml
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fieldz-engine-${{ matrix.platform }}
          cache-on-failure: true
          save-if: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: THIRD-PARTY-LICENSES.txt
        run: cargo xtask licences
      - name: Build the CLI
        run: cargo build --release --locked -p fieldcraft-cli --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          name="fieldz-engine-${GITHUB_REF_NAME#fieldz-engine-}-${{ matrix.platform }}"
          [ "${GITHUB_REF_TYPE}" = tag ] || name="fieldz-engine-dev-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/fieldcraft-cli${{ matrix.exe }}"
          if [ "${{ runner.os }}" != Windows ]; then strip "$bin"; fi
          # an arm64 Mac runs only signed code: strip drops the linker's ad-hoc signature, so sign it again (ad hoc)
          if [ "${{ runner.os }}" = macOS ]; then codesign --force --sign - "$bin" && codesign --verify "$bin"; fi
          cp "$bin" LICENSE-APACHE LICENSE-MIT NOTICE THIRD-PARTY-LICENSES.txt "dist/$name/"
          "dist/$name/fieldcraft-cli${{ matrix.exe }}" --version || true
          cd dist
          if [ "${{ matrix.pack }}" = zip ]; then
            if [ "${{ runner.os }}" = Windows ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else zip -qr "$name.zip" "$name"; fi
          else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldz-engine-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" --notes "Engine CLI built from ${GITHUB_SHA} (branch fieldz/sc-*: the design kernel re-pinned). Unsigned builds; verify with SHA256SUMS.txt." *
