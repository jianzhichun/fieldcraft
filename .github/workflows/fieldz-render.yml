# Push the source commit to the platform's long-lived CI branch to reuse its Rust cache.
# The caller downloads the zip from this run; checksums and releases are handled separately.
name: fieldz-render
on:
  push:
    branches:
      - fieldz/render-ci/windows
      - fieldz/render-ci/macos
permissions:
  contents: read
jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ${{ github.ref_name == 'fieldz/render-ci/windows' && 'windows-latest' || 'macos-15' }}
    timeout-minutes: 150
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      TARGET: ${{ github.ref_name == 'fieldz/render-ci/windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
      SUFFIX: ${{ github.ref_name == 'fieldz/render-ci/windows' && 'windows-x64' || 'macos-aarch64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fieldz-render-${{ env.SUFFIX }}
          cache-on-failure: true
          save-if: true
      - name: Generate third-party licenses
        run: cargo xtask licences
      - name: Build the render server
        shell: bash
        run: cargo build --release --locked -p fieldz-render-server --target "$TARGET"
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          name="render-$SUFFIX"
          bin="target/$TARGET/release/fieldz-render-server"
          if [[ "$RUNNER_OS" == Windows ]]; then
            bin+=.exe
          else
            strip "$bin"
            codesign --force --sign - "$bin"
            codesign --verify "$bin"
          fi
          mkdir -p "dist/$name"
          cp "$bin" LICENSE-APACHE LICENSE-MIT NOTICE THIRD-PARTY-LICENSES.txt "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            zip -qr "$name.zip" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldz-render-${{ env.SUFFIX }}
          path: dist/render-${{ env.SUFFIX }}.zip
          if-no-files-found: error
          compression-level: 0
